<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>负责人结算台 · 三角嗅辨盲评</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="container">
  <header class="hero">
    <h1>负责人结算台</h1>
    <p><a href="/">← 返回首页</a></p>
  </header>

  <div id="app"></div>
</div>

<script src="/static/app.js"></script>
<script>
const appEl = document.getElementById('app');
const params = new URLSearchParams(location.search);
const code = params.get('test');
const token = params.get('token');
let timer = null;

if (!code || !token) {
  appEl.innerHTML = `<div class="card"><div class="callout err">
    缺少测试码或令牌。请从<a href="/">首页</a>创建或重新打开。</div></div>`;
} else {
  load();
}

// 撤销按钮随列表动态渲染，用事件委托处理（列表刷新后依然有效）
document.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-revoke]');
  if (btn) revokeShare(btn.dataset.revoke, btn);
});

async function load() {
  try {
    const t = await api(`/api/tests/${encodeURIComponent(code)}?token=${encodeURIComponent(token)}`);
    render(t);
  } catch (err) {
    appEl.innerHTML = `<div class="card"><div class="callout err">${esc(err.message)}</div>
      <p class="small"><a href="/">返回首页</a></p></div>`;
  }
}

function render(t) {
  const srvOffset = t.now - Date.now();  // 倒计时以服务端时钟为准
  const remain = t.deadline - (Date.now() + srvOffset);
  const past = remain <= 0;
  const frozen = !!(t.ended || t.settled);  // 提前结束或结算：名单/答卷入口均已冻结
  appEl.innerHTML = `
    <div class="card">
      <h2>测试 <span class="mono">${esc(t.test_code)}</span></h2>
      <p class="small">样本 A：<b>${esc(t.sample_a)}</b> ｜ 样本 B：<b>${esc(t.sample_b)}</b></p>
      <p class="small">截止时间：<b>${fmtTime(t.deadline)}</b>
        ｜ 最少有效答卷：<b>${t.min_valid}</b> 份</p>
      <p class="small">距截止：<b id="countdown" style="font-size:16px">${esc(fmtCountdown(remain))}</b></p>
      ${t.ended ? `
      <div class="callout no">
        收集已于 ${fmtTime(t.ended_at)} 由负责人<b>提前结束</b>，名单与答卷入口已冻结。
        结束原因：${esc(t.end_reason)}
      </div>` : ''}
      <div class="stat-grid">
        <div class="stat"><div class="num">${t.progress.total}</div><div class="cap">评员总数</div></div>
        <div class="stat"><div class="num">${t.progress.submitted}</div><div class="cap">已提交(含弃权)</div></div>
        <div class="stat"><div class="num">${t.progress.valid}</div><div class="cap">有效答卷</div></div>
        <div class="stat"><div class="num">${t.withdrawn_count || 0}</div><div class="cap">已撤回</div></div>
      </div>
      <p class="hint">截止前仅显示汇总计数，不显示任何评员的答案与三杯对应关系，以防泄露。</p>
      <button id="settleBtn" ${((!past && !t.ended) || t.settled) ? 'disabled' : ''}>
        ${t.settled ? '已结算（结果已冻结）'
          : (past || t.ended) ? '立即结算' : '到期或结束收集后才能结算'}
      </button>
      <div id="settleMsg"></div>
      <div id="report"></div>
    </div>

    ${(!t.ended && !t.settled && !past) ? `
    <div class="card">
      <h2>提前结束收集（截止前 · 谨慎操作）</h2>
      <p class="hint">
        提交后<b>立即冻结名单与答卷入口</b>：评员再访问或提交都会收到“已结束”，
        撤回 / 补位也将被拒绝；此操作<b>不可撤销</b>。结束后可立即在上方结算，
        结算仍按已有有效答卷、最少有效答卷数与 p 值规则冻结结果。
        未结束的实验保持原截止行为。
      </p>
      <label>结束原因（必填，1～200 字，将记入操作时间线）</label>
      <textarea id="endReason" rows="3" maxlength="200"
        placeholder="例如：有效答卷已达标，提前结算"></textarea>
      <button id="endBtn" class="danger">提前结束收集</button>
      <div id="endMsg"></div>
    </div>` : ''}

    ${t.settled ? `
    <div class="card">
      <h2>脱敏结果分享凭证</h2>
      <p class="hint">
        为已结算实验生成<b>不记名只读凭证</b>，持有者可凭地址读取脱敏结果：
        仅含样本编号、截止与结算时间、有效答卷数、答对数、弃权数、未交数、
        单侧尾概率与可辨结论；<b>不</b>包含评员姓名、盲评码、个人答案或异样杯对应关系。
        有效期最长 <b>7 天</b>，到期前可随时撤销；到期或撤销后读取一律拒绝。
        同一备注 + 同一有效期重复请求会返回原凭证。
      </p>
      <div class="row">
        <div>
          <label>有效期</label>
          <select id="shareTtl">
            <option value="3600">1 小时</option>
            <option value="21600">6 小时</option>
            <option value="43200">12 小时</option>
            <option value="86400">1 天</option>
            <option value="259200">3 天</option>
            <option value="432000">5 天</option>
            <option value="604800" selected>7 天（最长）</option>
          </select>
        </div>
        <div style="flex:2">
          <label>备注（可选，用于区分发给谁；同备注同有效期返回原凭证）</label>
          <input type="text" id="shareNote" maxlength="200"
            placeholder="例如：发给合作方 / 公示链接">
        </div>
      </div>
      <button id="shareCreateBtn">生成分享凭证</button>
      <div id="shareMsg"></div>
      <div id="shareList">${renderShares(t.shares || [])}</div>
    </div>` : ''}

    <div class="card">
      <h2>名单调整（截止前 · 缺席处理）</h2>
      <p class="hint">
        可只补位、只撤回，或一次操作同时撤回并补位。仅<b>未提交</b>者可撤回；
        已作答或已弃权者不可撤回，撤回后的旧码立即失效。补位评员取得新专属码，
        同一实验姓名不得重用；已有评员的杯序、异样样本与答卷不变，
        新分配会尽量均衡异样杯位置与异样样本。
        调整后有效人数须在 <b>${t.min_valid}</b> ～ <b>500</b> 人之间，
        任一校验失败则整次操作无效。
      </p>
      ${(past || frozen) ? `
        <div class="callout ${t.settled ? 'no' : 'warn'}">
          ${t.settled ? '测试已结算，名单已冻结，不能调整。'
            : t.ended ? '收集已提前结束，名单已冻结，不能调整。'
            : '已过截止时间，不能调整名单。'}
        </div>` : `
        <label>要撤回的盲评码（每行一个；可留空表示只补位）</label>
        <textarea id="withdrawCodes" rows="3"
          placeholder="贴入缺席评员的盲评码，每行一个"></textarea>
        <label>补位评员姓名（每行一个；可留空表示只撤回）</label>
        <textarea id="addPanelists" rows="3"
          placeholder="新评员姓名，每行一个"></textarea>
        <button id="adjustBtn">执行调整</button>
        <div id="adjustMsg"></div>`}
    </div>

    <div class="card">
      <h2>盲评码分发名单（仅负责人可见）</h2>
      <p class="hint">请将每人的专属链接单独发给本人；盲评码不可重复使用。</p>
      <table>
        <thead><tr><th>评员</th><th>盲评码 / 专属链接</th></tr></thead>
        <tbody>
          ${t.codes.map(c => `
            <tr>
              <td>${esc(c.panelist)}</td>
              <td class="code">${esc(c.code)}
                <a href="${esc(c.url)}" target="_blank" class="small">打开</a></td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>`;

  clearInterval(timer);
  timer = setInterval(() => {
    const el = document.getElementById('countdown');
    if (el) el.textContent = fmtCountdown(t.deadline - (Date.now() + srvOffset));
    const btn = document.getElementById('settleBtn');
    if (btn && !t.settled && !t.ended
        && t.deadline - (Date.now() + srvOffset) <= 0 && btn.disabled) {
      btn.disabled = false;
      btn.textContent = '立即结算';
    }
  }, 1000);

  document.getElementById('settleBtn').addEventListener('click', doSettle);
  const adjustBtn = document.getElementById('adjustBtn');
  if (adjustBtn) adjustBtn.addEventListener('click', doAdjust);
  const endBtn = document.getElementById('endBtn');
  if (endBtn) endBtn.addEventListener('click', doEnd);
  const shareBtn = document.getElementById('shareCreateBtn');
  if (shareBtn) shareBtn.addEventListener('click', doCreateShare);
  if (t.settled) doSettle();
}

function renderShares(shares) {
  if (!shares.length) return '<p class="hint">尚未生成分享凭证。</p>';
  return `
    <table style="margin-top:16px">
      <thead><tr><th>备注</th><th>凭证 / 读取地址</th><th>到期时间</th><th>状态</th><th>操作</th></tr></thead>
      <tbody>
        ${shares.map(s => `
          <tr>
            <td>${s.note ? esc(s.note) : '<span class="small">（无备注）</span>'}</td>
            <td class="code">${esc(s.share_code)}<br>
              <a href="${esc(s.read_url)}" target="_blank" class="small">${esc(s.read_url)}</a></td>
            <td>${fmtTime(s.expires_at)}</td>
            <td>${s.revoked ? '<span class="badge no">已撤销</span>'
                : s.active ? '<span class="badge ok">有效</span>'
                : '<span class="badge wait">已过期</span>'}</td>
            <td>${s.active
                ? `<button class="danger" data-revoke="${esc(s.share_code)}"
                     style="padding:4px 12px;margin:0">撤销</button>`
                : '—'}</td>
          </tr>`).join('')}
      </tbody>
    </table>`;
}

async function doCreateShare() {
  const msgEl = document.getElementById('shareMsg');
  const ttl = parseInt(document.getElementById('shareTtl').value, 10);
  const note = document.getElementById('shareNote').value.trim();
  const btn = document.getElementById('shareCreateBtn');
  btn.disabled = true; btn.textContent = '生成中…';
  try {
    const r = await api(`/api/tests/${encodeURIComponent(code)}/shares`, {
      method: 'POST', body: { token, ttl_seconds: ttl, note },
    });
    msgEl.innerHTML = `<div class="callout ok">
      ${r.reused ? '该备注 + 有效期已存在，返回原凭证：' : '已生成一次性分享凭证（仅展示本次）：'}
      <span class="mono">${esc(r.share_code)}</span><br>
      读取地址：<span class="mono small">${location.origin}${esc(r.read_url)}</span><br>
      到期：${fmtTime(r.expires_at)} ｜ 到期或撤销后读取会被拒绝。
    </div>`;
    load();  // 刷新凭证列表
  } catch (err) {
    showErr(msgEl, err.message);
    btn.disabled = false; btn.textContent = '生成分享凭证';
  }
}

async function revokeShare(code_, btn) {
  if (!confirm('确认撤销该分享凭证？撤销后持有方将立即无法读取，且不可恢复。')) return;
  btn.disabled = true;
  try {
    await api(`/api/tests/${encodeURIComponent(code)}/shares/${encodeURIComponent(code_)}/revoke`,
      { method: 'POST', body: { token } });
    load();
  } catch (err) {
    showErr(document.getElementById('shareMsg'), err.message);
    btn.disabled = false;
  }
}

async function doAdjust() {
  const msgEl = document.getElementById('adjustMsg');
  const wCodes = document.getElementById('withdrawCodes').value.split('\n')
    .map(s => s.trim()).filter(Boolean);
  const aNames = document.getElementById('addPanelists').value.split('\n')
    .map(s => s.trim()).filter(Boolean);
  if (wCodes.length === 0 && aNames.length === 0) {
    showErr(msgEl, '请至少填写要撤回的盲评码或补位评员姓名。');
    return;
  }
  const word = (wCodes.length && aNames.length)
    ? `撤回 ${wCodes.length} 人并补位 ${aNames.length} 人`
    : wCodes.length ? `撤回 ${wCodes.length} 人`
    : `补位 ${aNames.length} 人`;
  if (!confirm(`确认${word}？任一校验失败将整次无效（不产生任何改动）。`)) return;

  const btn = document.getElementById('adjustBtn');
  btn.disabled = true; btn.textContent = '调整中…';
  try {
    const r = await api(`/api/tests/${encodeURIComponent(code)}/adjust`, {
      method: 'POST',
      body: { token, withdraw_codes: wCodes, add_panelists: aNames },
    });
    const lines = [];
    if (r.withdrawn.length)
      lines.push(`已撤回：${r.withdrawn.map(x => esc(x.panelist)).join('、')}（旧码已立即失效）`);
    if (r.added.length)
      lines.push(`已补位：${r.added.map(x => esc(x.panelist)).join('、')}` +
        `（新盲评码见下方分发名单）`);
    lines.push(`当前有效名单 ${r.progress.total} 人。`);
    showInfo(msgEl, lines.join(' '), 'ok');
    setTimeout(load, 1200);  // 刷新以展示新分发码与计数
  } catch (err) {
    showErr(msgEl, err.message);
    btn.disabled = false; btn.textContent = '执行调整';
  }
}

async function doEnd() {
  const msgEl = document.getElementById('endMsg');
  const reason = document.getElementById('endReason').value.trim();
  if (!reason) { showErr(msgEl, '请填写结束原因（1～200 字）。'); return; }
  if (reason.length > 200) { showErr(msgEl, '结束原因不得超过 200 字。'); return; }
  if (!confirm('确认提前结束收集？\n\n提交后名单与答卷入口立即冻结，'
      + '评员将无法再访问或提交，撤回/补位也被拒绝，且此操作不可撤销。')) return;

  const btn = document.getElementById('endBtn');
  btn.disabled = true; btn.textContent = '结束中…';
  try {
    const r = await api(`/api/tests/${encodeURIComponent(code)}/end`, {
      method: 'POST', body: { token, reason },
    });
    showInfo(msgEl,
      (r.reused ? '该实验已处于结束状态（返回同一结束记录）：'
                : '收集已提前结束，答卷入口已冻结。')
      + `结束时间 ${fmtTime(r.ended_at)}。可立即结算。`, 'ok');
    load();  // 刷新以展示结束横幅、启用结算并冻结名单调整
  } catch (err) {
    showErr(msgEl, err.message);
    btn.disabled = false; btn.textContent = '提前结束收集';
  }
}

async function doSettle() {
  const btn = document.getElementById('settleBtn');
  const msgEl = document.getElementById('settleMsg');
  if (btn) { btn.disabled = true; btn.textContent = '结算中…'; }
  try {
    const r = await api(`/api/tests/${encodeURIComponent(code)}/settle`, {
      method: 'POST', body: { token },
    });
    renderReport(r);
    if (btn) { btn.disabled = true; btn.textContent = '已结算（结果已冻结）'; }
  } catch (err) {
    showErr(msgEl, err.message);
    if (btn) { btn.disabled = false; btn.textContent = '立即结算'; }
  }
}

function renderReport(r) {
  const el = document.getElementById('report');
  const kind = r.distinguishable ? 'ok' : 'no';
  const label = r.distinguishable
    ? '<span class="badge ok">判为可辨</span>'
    : '<span class="badge no">不可判为可辨</span>';
  el.innerHTML = `
    <h2 style="margin-top:24px">结算结果 ${label}</h2>
    <div class="callout ${kind === 'ok' ? 'ok' : 'warn'}">${esc(r.conclusion)}</div>
    <div class="stat-grid">
      <div class="stat"><div class="num">${r.valid_count}</div><div class="cap">有效答卷</div></div>
      <div class="stat"><div class="num">${r.correct_count}</div><div class="cap">答对</div></div>
      <div class="stat"><div class="num">${r.abstained_count}</div><div class="cap">弃权</div></div>
      <div class="stat"><div class="num">${r.missing_count}</div><div class="cap">未交</div></div>
      <div class="stat"><div class="num">${r.p_value === null ? '—' : r.p_value.toFixed(4)}</div>
        <div class="cap">单侧尾概率 (p=1/3)</div></div>
    </div>
    <p class="hint">判定规则：有效答卷 ≥ ${r.min_valid} 且
      P(X≥答对 | X~Binomial(n,1/3)) ≤ 0.05 才判为可辨。</p>

    <h2>分配与答卷回看（冻结）</h2>
    <table>
      <thead><tr>
        <th>评员</th><th>盲评码</th><th>异样杯位置</th><th>异样杯样本</th>
        <th>提交答案</th><th>判定</th>
      </tr></thead>
      <tbody>
        ${r.assignments.map(a => `
          <tr class="${a.correct === true ? 'hit' : a.correct === false ? 'miss' : ''}">
            <td>${esc(a.panelist)}</td>
            <td class="code">${esc(a.code)}</td>
            <td>${a.odd_pos} 号杯</td>
            <td>样本 ${esc(a.odd_sample)}</td>
            <td>${a.answer === null ? '<span class="badge wait">未交</span>'
                : a.answer === '弃权' ? '<span class="badge wait">弃权</span>'
                : `${a.answer} 号杯`}</td>
            <td>${a.correct === null ? '—'
                : a.correct ? '<span class="badge ok">答对</span>'
                : '<span class="badge no">答错</span>'}</td>
          </tr>`).join('')}
      </tbody>
    </table>`;
}
</script>
</body>
</html>
